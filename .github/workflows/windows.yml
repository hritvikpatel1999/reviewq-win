name: Windows
on:
  push:
    paths: ['windows/**', 'scripts/*windows*', '.github/workflows/windows.yml', 'README.md']
  pull_request:
    paths: ['windows/**', 'scripts/*windows*', '.github/workflows/windows.yml', 'README.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x86
          - runner: windows-latest
            rid: win-x64
          - runner: windows-11-arm
            rid: win-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install packaging compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
      - name: Test and package native target
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Runtime '${{ matrix.rid }}'
      - name: Desktop startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\dist\windows\publish\${{ matrix.rid }}\ReviewQ.exe'
          $process = Start-Process $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id
            throw 'Desktop smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Desktop smoke test failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: ReviewQ-${{ matrix.rid }}
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe
            dist/windows/SHA256SUMS.txt
